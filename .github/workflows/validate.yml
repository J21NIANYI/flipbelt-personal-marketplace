name: Validate personal marketplace

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Skills-only marketplace, plugin, and public boundary
        run: python scripts/validate_marketplace.py
      - name: Validate deterministic Review size-chart behavior
        shell: pwsh
        run: ./scripts/test_review_parity.ps1
